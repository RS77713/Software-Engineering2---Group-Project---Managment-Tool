name: Baseline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run verify:sqlite
      - run: npm run lint
      - run: npm test
      - run: npm run build
